name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v3.7.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Job-level so later steps can test whether a token was supplied at all.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10, which cannot do OIDC trusted publishing.
      - name: Use npm >= 11.5.1
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # npm answers an unauthenticated/expired-token publish with a bare
      # "404 Not Found - PUT", which reads like the package doesn't exist.
      # Fail here instead, with a message that says what actually happened.
      - name: Verify npm credentials
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "::error::NPM_TOKEN is invalid, expired, or lacks write access to zerogpu-cli. npm reports: $WHO"
            echo "::error::Mint a new granular token at https://www.npmjs.com/settings/~/tokens (Read and write, scoped to zerogpu-cli) and update the NPM_TOKEN repo secret, or configure Trusted Publishing and delete the secret."
            exit 1
          fi
          echo "Authenticated to npm as $WHO"

      - name: Publish to npm
        env:
          # Empty when Trusted Publishing (OIDC) is configured for the package;
          # npm then exchanges the Actions id-token for a short-lived credential.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
