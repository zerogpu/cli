name: Release

# Fully automatic. Push to main -> CI runs -> if CI is green and package.json
# carries a new version (with package-lock.json agreeing), this tags the commit,
# publishes to npm, and cuts a GitHub Release.
#
# A push that doesn't bump the version is a no-op: the run goes green and the
# publish job is skipped. Nothing here needs a button.
#
# workflow_dispatch is an escape hatch for retrying a release that died at the
# registry, not the normal path.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # The CI gate. A failed or cancelled CI run never reaches the release, and
    # the event check keeps pull-request CI runs out.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Resolve commit
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.sha }}
          # Brings the tags down, which is how "already released" is answered.
          fetch-depth: 0

      # Every skip here is deliberately quiet: a warning or a notice, never a
      # failure. Most pushes to main are not releases, and a red X on each one
      # would train everybody to ignore the X that matters.
      - name: Decide whether to release
        id: decide
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          PKG="$(node -p "require('./package.json').version")"
          TAG="v$PKG"

          # package-lock.json carries the version twice and npm writes both, so
          # a half-updated lockfile means the bump was done by hand and is
          # probably not what anyone meant to ship.
          LOCK_ROOT="$(node -p "require('./package-lock.json').version")"
          LOCK_SELF="$(node -p "require('./package-lock.json').packages[''].version")"

          HIGHEST="$(git tag -l 'v*' | sed 's|^v||' | sort -V | tail -1)"

          PUBLISH=true
          if [ "$LOCK_ROOT" != "$PKG" ] || [ "$LOCK_SELF" != "$PKG" ]; then
            PUBLISH=false
            echo "::warning::package.json is $PKG but package-lock.json says $LOCK_ROOT / $LOCK_SELF. Run 'npm install' to sync the lockfile and push again. Not releasing."
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            PUBLISH=false
            echo "::notice::$TAG is already tagged — version $PKG is published. Nothing to release."
          elif [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$PKG" | sort -V | tail -1)" != "$PKG" ]; then
            # Nobody eyeballs the number any more, so refuse to make an older
            # version the npm latest. That is not undoable.
            PUBLISH=false
            echo "::warning::package.json is $PKG, which is older than the latest release $HIGHEST. Not releasing."
          else
            echo "::notice::Releasing $TAG from $SHA"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Job-level so later steps can test whether a token was supplied at all.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Node 20 ships npm 10, which cannot do OIDC trusted publishing. Pinned to
      # the 11.x line on purpose: npm 12 requires Node 22+, and this job stays on
      # the Node version the package claims to support.
      - name: Use npm >= 11.5.1
        run: npm install -g npm@^11

      - run: npm ci
      - run: npm run build
      - run: npm test

      # npm answers an unauthenticated/expired-token publish with a bare
      # "404 Not Found - PUT", which reads like the package doesn't exist.
      # Fail here instead, with a message that says what actually happened.
      - name: Verify npm credentials
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "::error::NPM_TOKEN is invalid, expired, or lacks write access to zerogpu-cli. npm reports: $WHO"
            echo "::error::Mint a new granular token at https://www.npmjs.com/settings/~/tokens (Read and write, scoped to zerogpu-cli) and update the NPM_TOKEN repo secret, or configure Trusted Publishing and delete the secret."
            exit 1
          fi
          echo "Authenticated to npm as $WHO"

      # Last thing before the publish, so a failure above leaves no tag behind
      # and the next push can simply try again.
      - name: Push tag
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Publish to npm
        env:
          # Empty when Trusted Publishing (OIDC) is configured for the package;
          # npm then exchanges the Actions id-token for a short-lived credential.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
